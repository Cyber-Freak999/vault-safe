[project]
name = "vaultsafe-client"
version = "0.1.0"
description = "Zero-knowledge reference client for VaultSafe"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.13"
