[project]
name = "vaultsafe-server"
version = "0.1.0"
description = "VaultSafe server - zero-knowledge password manager API"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "mypy>=1.8",
    "ruff>=0.5",
    "django-stubs>=5.0",
    "djangorestframework-stubs>=3.15",
    "vaultsafe-client",
]
prod = ["gunicorn>=23.0"]

[tool.uv.sources]
vaultsafe-client = { workspace = true }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "vaultsafe.settings"
django_debug_mode = "keep"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = ["*.tests", "vaultsafe.migrations.*", "manage"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["vaultsafe.settings", "vaultsafe.urls", "vaultsafe.wsgi", "vaultsafe.asgi"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "vaultsafe.settings"
